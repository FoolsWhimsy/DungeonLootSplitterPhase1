<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <meta content="Richard Hsu" name="author">
    <link href="css/style.css" rel="stylesheet" type="text/css">
    <title>Dungeon Loot Splitter</title>
</head>
<body>
<header class="header">
    <h1>Dungeon Loot Splitter</h1>
</header>

<main>
    <!-- Creates the Party List Section -->
    <section class="panel party" aria-labelledby="party-title">
        <h2 id="party-title">Party Setup</h2>
        <div class="field">
            <label for="partySize">Number of Party Members</label>
            <input type="number" id="partySize" name="partySize" min="1" step="1" inputmode="numeric" value="1">
        </div>
        <p class="help">Please use whole numbers of 1 or more.</p>
    </section>

    <!-- Creates the Add Loot Section -->
    <section class="panel add-loot" aria-labelledby="add-title">
        <h2 id="add-title">Add Loot</h2>
        <div class="field">
            <label for="lootName">Loot Name</label>
            <input type="text" id="lootName" name="lootName" placeholder="Goblin Dagger">
        </div>
        <div class="field">
            <label for="lootValue">Loot Value</label>
            <input type="number" id="lootValue" name="lootValue" min="0" step="0.01" inputmode="decimal" placeholder="5.5">
        </div>
        <button type="button" class="button" id="addLoot">Add Loot</button>
        <p class="message" id="lootMessage" role="status"></p>
    </section>

    <!-- Creates the Loot List Section -->
    <section class="panel loot-list-panel" aria-labelledby="list-title">
        <h2 id="list-title">Loot List</h2>
        <p class="help" id="emptyLoot">No loot found. Please add an item.</p>
        <ul class="loot-list" id="lootList"></ul>
        <p class="total-row">Total Loot <strong id="lootTotal">$0.00</strong></p>
    </section>

    <!-- Creates the Split Loot Section -->
    <section class="panel split-panel" aria-labelledby="split-title">
        <h2 id="split-title">Split Loot</h2>
        <button type="button" class="button" id="splitLoot">Split Loot</button>
        <div class="results">
            <p class="total-row">TOTAL LOOT <strong id="splitTotal">$0.00</strong> </p>
            <p class="total-row">LOOT PER PARTY MEMBER <strong id="perMember">0</strong></p>
        </div>
        <p class="message" id="splitMessage" role="status" aria-live="polite"></p>
    </section>

    <!-- Creates the Logic Explanation Section -->
    <section class="panel reflection" aria-labelledby="logic-title">
        <h2 id="logic-title">Logic Explanation</h2>
        <p></p>
    </section>
</main>
<!-- Javascript Link -->
<script src="js/script.js"></script>
</body>
</html>
